name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: homelab-operator check-pr --body-file tests/fixtures/good_pr_body.md --github-annotations
      - run: homelab-operator check-receipt --file tests/fixtures/good_receipt.md --github-annotations
      - run: homelab-operator check-claim --json-file tests/fixtures/surface_claim.json --github-annotations
      - run: homelab-operator check-estate --file examples/minimal-homelab/estate.yaml --github-annotations
      - run: homelab-operator doctor --root . --github-annotations
