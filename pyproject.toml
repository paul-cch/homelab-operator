[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homelab-operator"
version = "1.0.0"
description = "Contracts and templates for AI-assisted infrastructure maintenance."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Paul Couach" }
]
keywords = [
  "ai-operations",
  "agents",
  "ci",
  "codex",
  "devops",
  "homelab",
  "infrastructure",
  "maintenance",
  "operations",
  "platform-engineering",
  "runbooks",
  "sre",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/paul-cch/homelab-operator"
Documentation = "https://github.com/paul-cch/homelab-operator/tree/main/docs"
Repository = "https://github.com/paul-cch/homelab-operator"
Issues = "https://github.com/paul-cch/homelab-operator/issues"
Changelog = "https://github.com/paul-cch/homelab-operator/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "build>=1",
  "pytest>=8",
  "ruff>=0.8",
  "twine>=6",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[project.scripts]
homelab-operator = "homelab_operator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/homelab_operator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
