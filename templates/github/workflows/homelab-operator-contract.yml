name: Homelab Operator Contract

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: homelab-operator-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  HOMELAB_OPERATOR_REF: v1.0.0

jobs:
  pr-contract:
    name: Validate PR body and privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install Homelab Operator
        run: python -m pip install "git+https://github.com/paul-cch/homelab-operator.git@${HOMELAB_OPERATOR_REF}"
      - name: Write PR body
        env:
          PR_BODY_JSON: ${{ toJson(github.event.pull_request.body) }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          body = json.loads(os.environ["PR_BODY_JSON"])
          Path(os.environ["RUNNER_TEMP"], "pr-body.md").write_text(body or "", encoding="utf-8")
          PY
      - name: Validate live PR body
        run: homelab-operator check-pr --body-file "$RUNNER_TEMP/pr-body.md"
      - name: Scan checked-out files for private material
        run: homelab-operator check-privacy --root .
